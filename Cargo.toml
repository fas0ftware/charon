[package]
name = "charon"
version = "0.3.0"
edition = "2021"
description = "Send files between devices on your own network: one-time, expiring, TLS links with a QR code. No cloud."
license = "MIT"
rust-version = "1.75"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = true
strip = true
opt-level = 3

[dev-dependencies]
tempfile = "3"
